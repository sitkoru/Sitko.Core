services:
  valkey:
    image: valkey/valkey:8.1.4-alpine@sha256:e706d1213aaba6896c162bb6a3a9e1894e1a435f28f8f856d14fab2e10aa098b
    entrypoint: ["sh", "/fixture/start.sh"]
    volumes:
      - ./start.sh:/fixture/start.sh:ro
    ports:
      - "127.0.0.1:16379-16381:16379-16381"
      - "127.0.0.1:26379-26381:26379-26381"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 26381 --user sentinel-client -a sentinel-test ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 30

  cluster:
    image: valkey/valkey:9.0.3-alpine@sha256:e1095c6c76ee982cb2d1e07edbb7fb2a53606630a1d810d5a47c9f646b708bf5
    entrypoint: ["sh", "/fixture/cluster-start.sh"]
    volumes:
      - ./cluster-start.sh:/fixture/cluster-start.sh:ro
    ports:
      - "127.0.0.1:17379-17384:17379-17384"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 17379 -a cluster-test cluster info | grep -q cluster_state:ok"]
      interval: 1s
      timeout: 3s
      retries: 30
