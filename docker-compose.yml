services:
  nats:
    image: nats-streaming:latest
    command: ["-cid", "test-cluster"]
    ports:
      - "4222:4222"

  consul:
    image: hashicorp/consul
    ports:
      - "8500:8500"

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"

  sonyflake:
    image: titpetric/sonyflake
    ports:
      - "8987:80"

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: sikdadasDA123@ituDSSaMydfdssdss
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio
    environment:
      MINIO_ROOT_USER: ptTYf7VkCVbUjAzn
      MINIO_ROOT_PASSWORD: RddqonEnrZZaCU7kkZszN9yiMFkX7rH3
    ports:
      - "9000:9000"
      - "9001:9001"

  vault:
    image: hashicorp/vault:1.21.4
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: twit3itPSAD0yok
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  redis:
    image: redis:alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 4G --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

volumes:
  redis:
