name: Release

env:
  DOTNET_VERSION: 10.0.x

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Prepare
        id: prep
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Install node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            src/Sitko.Core.Blazor.AntDesign/Web/package.json
      - name: Build Sitko.Core.Blazor.AntDesign js
        working-directory: src/Sitko.Core.Blazor.AntDesign/Web
        shell: bash
        run: |
          npm ci
          npm run prod
      - name: Build
        run: dotnet build -c Release /p:Version=${{ steps.prep.outputs.version }}
      - name: Create packages
        run: dotnet pack -c Release --no-build /p:Version=${{ steps.prep.outputs.version }} -p:PackageOutputPath=$(pwd)/packages
      - name: Push to Github Packages
        run: find packages -type f -name 'Sitko.Core.*.nupkg' -print0 | xargs -0 -n 10 -P 4 dotnet nuget push -s https://nuget.pkg.github.com/sitkoru/index.json  --skip-duplicate --no-symbols -k ${GITHUB_TOKEN}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to Nuget
        run: find packages -type f -name 'Sitko.Core.*.nupkg' -print0 | xargs -0 -n 10 -P 4 dotnet nuget push -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }}
      - name: Add Internal NuGet Source
        run: >
          dotnet nuget add source --username ${{ secrets.INTERNAL_NUGET_USER }}
          --password ${{ secrets.INTERNAL_NUGET_PASSWORD }}
          --store-password-in-clear-text
          --name internal-source ${{ secrets.INTERNAL_NUGET_URL }}
      - name: Push to Internal Packages
        run: find packages -type f -name 'Sitko.Core.*.nupkg' -print0 | xargs -0 -n 10 -P 4 dotnet nuget push --source internal-source --skip-duplicate --no-symbols -k ${INTERNAL_NUGET_TOKEN}
        env:
          INTERNAL_NUGET_TOKEN: ${{ secrets.INTERNAL_NUGET_PASSWORD }}
          NUGET_BASE_URL: ${{ secrets.INTERNAL_NUGET_SHORT_URL }}
