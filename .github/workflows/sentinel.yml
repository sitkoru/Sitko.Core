name: Совместимость Redis и Valkey

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  sentinel:
    name: Redis ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - name: Установить .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Запустить Valkey Sentinel и Cluster
        run: docker compose -p sitko-sentinel-tests -f tests/Sitko.Core.Auth.Tests/Valkey/compose.yml up -d --wait
      - name: Проверить аутентификацию, изоляцию баз и переключение основного узла
        run: >-
          dotnet test tests/Sitko.Core.Auth.Tests/Sitko.Core.Auth.Tests.csproj
          --framework ${{ matrix.framework }}
          --logger "trx;LogFileName=sentinel.trx"
          --results-directory TestResults/sentinel-${{ matrix.framework }}
      - name: Получить журналы Valkey Sentinel и Cluster
        if: always()
        run: docker compose -p sitko-sentinel-tests -f tests/Sitko.Core.Auth.Tests/Valkey/compose.yml logs --no-color
      - name: Остановить стенд
        if: always()
        run: docker compose -p sitko-sentinel-tests -f tests/Sitko.Core.Auth.Tests/Valkey/compose.yml down --volumes
      - name: Сохранить результаты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-test-results-${{ matrix.framework }}
          path: TestResults/sentinel-${{ matrix.framework }}/*.trx
          retention-days: 3
