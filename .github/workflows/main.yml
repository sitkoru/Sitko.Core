    services:
      nats:
        image: nats-streaming:latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for NATS
        run: >-
          timeout 60 bash -c
          'until (echo > /dev/tcp/nats/4222) 2>/dev/null; do sleep 1; done'
      - name: Run Sitko.Core.Queue.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.Queue.Test/Sitko.Core.Queue.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
