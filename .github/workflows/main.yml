          --diagnostic --diagnostic-output-directory TestResults/storage/Sitko.Core.Storage.FileSystem.Tests/net10.0/diagnostics
      - name: Run Sitko.Core.Storage.S3.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.Storage.S3.Tests/Sitko.Core.Storage.S3.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
          --report-trx --report-trx-filename Sitko.Core.Storage.S3.Tests-net10.0.trx
          --results-directory TestResults/storage/Sitko.Core.Storage.S3.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/storage/Sitko.Core.Storage.S3.Tests/net10.0/diagnostics
      - name: Run Sitko.Core.Storage.Remote.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.Storage.Remote.Tests/Sitko.Core.Storage.Remote.Tests.csproj
