name: Main

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: dotnet build -c Release
      - name: Create packages
        run: dotnet pack -c Release --no-build -p:PackageOutputPath=$(pwd)/packages
  apps:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.App.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.App.Tests/Sitko.Core.App.Tests.csproj
      - name: Run Sitko.Core.App.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.App.Tests/Sitko.Core.App.Tests.csproj

  blazor:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    steps:
      - uses: actions/checkout@v4
      - name: Install node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            src/Sitko.Core.Blazor.AntDesign/Web/package.json
      - name: Build Sitko.Core.Blazor.AntDesign js
        working-directory: src/Sitko.Core.Blazor.AntDesign/Web
        shell: bash
        run: |
          npm ci
          npm run prod
      - name: Run Sitko.Core.App.Blazor.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.App.Blazor.Tests/Sitko.Core.App.Blazor.Tests.csproj
      - name: Run Sitko.Core.App.Blazor.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.App.Blazor.Tests/Sitko.Core.App.Blazor.Tests.csproj

  grpc:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    env:
      CONSUL__CONSULURI: http://consul:8500
    services:
      consul:
        image: hashicorp/consul
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.Grpc.Client.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Grpc.Client.Tests/Sitko.Core.Grpc.Client.Tests.csproj
      - name: Run Sitko.Core.Grpc.Client.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Grpc.Client.Tests/Sitko.Core.Grpc.Client.Tests.csproj

  imgproxy:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.ImgProxy.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.ImgProxy.Tests/Sitko.Core.ImgProxy.Tests.csproj
      - name: Run Sitko.Core.ImgProxy.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.ImgProxy.Tests/Sitko.Core.ImgProxy.Tests.csproj

  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '8.0'
            sdk-version: '8.0.100'
            framework: net8.0
          - sdk: '10.0'
            sdk-version: '10.0.201'
            framework: net10.0
    container: mcr.microsoft.com/dotnet/sdk:${{ matrix.sdk }}
    env:
      Puppeteer__BrowserWsEndpoint: ws://browserless:3000/chromium?token=pdf-ci
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.57.0@sha256:6bac628b3d8293f8fb251d3a6b63030dfc5a1cb0c7e5c39abe5efd8f4b25360b
        env:
          TOKEN: pdf-ci
          CONCURRENT: '4'
        options: >-
          --health-cmd="curl --fail http://localhost:3000/pressure?token=pdf-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Select .NET SDK
        run: |
          cat > global.json <<'JSON'
          { "sdk": { "version": "${{ matrix.sdk-version }}", "rollForward": "latestFeature" } }
          JSON
          dotnet --version
          dotnet --list-sdks
      - name: Run Sitko.Core.Pdf.Tests ${{ matrix.framework }}
        run: >-
          dotnet test tests/Sitko.Core.Pdf.Tests/Sitko.Core.Pdf.Tests.csproj
          --logger GitHubActions --logger "trx;LogFileName=pdf.trx"
          --results-directory TestResults/pdf-${{ matrix.sdk }}
          --framework ${{ matrix.framework }} -p:TargetFrameworks=${{ matrix.framework }}
      - name: Save PDF test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-test-results-sdk-${{ matrix.sdk }}
          path: TestResults/pdf-${{ matrix.sdk }}/*.trx
          retention-days: 3
      - name: Trust workspace for PDF test report
        if: ${{ always() && github.event_name == 'push' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Report PDF tests
        if: ${{ always() && github.event_name == 'push' }}
        uses: dorny/test-reporter@v2
        with:
          name: PDF tests SDK ${{ matrix.sdk }}
          path: TestResults/pdf-${{ matrix.sdk }}/*.trx
          reporter: dotnet-trx

  queue:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    env:
      QUEUE__NATS__SERVERS__0: nats://nats:4222
      QUEUE__NATS__CLUSTERNAME: test-cluster
    services:
      nats:
        image: nats-streaming:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.Queue.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Queue.Test/Sitko.Core.Queue.Tests.csproj
      - name: Run Sitko.Core.Queue.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Queue.Test/Sitko.Core.Queue.Tests.csproj
      - name: Run Sitko.Core.Queue.Nats.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Queue.Nats.Tests/Sitko.Core.Queue.Nats.Tests.csproj
      - name: Run Sitko.Core.Queue.Nats.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Queue.Nats.Tests/Sitko.Core.Queue.Nats.Tests.csproj
      - name: Run Sitko.Core.Queue.InMemory.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Queue.InMemory.Tests/Sitko.Core.Queue.InMemory.Tests.csproj
      - name: Run Sitko.Core.Queue.InMemory.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Queue.InMemory.Tests/Sitko.Core.Queue.InMemory.Tests.csproj

  repository:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    env:
      DB__POSTGRES__TESTDBCONTEXT__HOST: postgres
      DB__POSTGRES__SECONDTESTDBCONTEXT__HOST: postgres
      DB__POSTGRES__TPHDBCONTEXT__HOST: postgres
      TESTS__USEPOSTGRES: "true"
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.Repository.EntityFrameworkCore.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Repository.EntityFrameworkCore.Tests/Sitko.Core.Repository.EntityFrameworkCore.Tests.csproj
      - name: Run Sitko.Core.Repository.EntityFrameworkCore.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Repository.EntityFrameworkCore.Tests/Sitko.Core.Repository.EntityFrameworkCore.Tests.csproj
      - name: Run Sitko.Core.Repository.Remote.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Repository.Remote.Tests/Sitko.Core.Repository.Remote.Tests.csproj
      - name: Run Sitko.Core.Repository.Remote.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Repository.Remote.Tests/Sitko.Core.Repository.Remote.Tests.csproj

  sonyflake:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    env:
      IDPROVIDER__SONYFLAKE__URI: http://sonyflake
    services:
      sonyflake:
        image: titpetric/sonyflake
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.SonyFlake.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.SonyFlake.Tests/Sitko.Core.SonyFlake.Tests.csproj
      - name: Run Sitko.Core.SonyFlake.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.SonyFlake.Tests/Sitko.Core.SonyFlake.Tests.csproj

  opensearch:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    env:
      Search__OpenSearch__Url: http://opensearch:9200
      Search__OpenSearch__Login: admin
      Search__OpenSearch__Password: sikdadasDA123@ituDSSaMydfdssdss
    services:
      opensearch:
        image: opensearchproject/opensearch:latest
        ports: [ "9200:9200" ]
        env:
          discovery.type: single-node
          plugins.security.disabled: true
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: sikdadasDA123@ituDSSaMydfdssdss
        options: >-
          --health-cmd="curl http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.Search.OpenSearch.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Search.OpenSearch.Tests/Sitko.Core.Search.OpenSearch.Tests.csproj
      - name: Run Sitko.Core.Search.OpenSearch.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Search.OpenSearch.Tests/Sitko.Core.Search.OpenSearch.Tests.csproj

  storage:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    env:
      STORAGE__S3__TESTS3STORAGESETTINGS__SERVER: http://minio:9000
      STORAGE__S3__TESTS3STORAGESETTINGS__ACCESSKEY: ptTYf7VkCVbUjAzn
      STORAGE__S3__TESTS3STORAGESETTINGS__SECRETKEY: RddqonEnrZZaCU7kkZszN9yiMFkX7rH3
      STORAGE__METADATA__POSTGRES__TESTS3STORAGESETTINGS__HOST: postgres
      STORAGE__METADATA__POSTGRES__TESTS3STORAGESETTINGS__USERNAME: postgres
      STORAGE__METADATA__POSTGRES__TESTS3STORAGESETTINGS__PASSWORD: 123
    services:
      minio:
        image: bitnamilegacy/minio
        env:
          MINIO_ROOT_USER: ptTYf7VkCVbUjAzn
          MINIO_ROOT_PASSWORD: RddqonEnrZZaCU7kkZszN9yiMFkX7rH3
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.Storage.FileSystem.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Storage.FileSystem.Tests/Sitko.Core.Storage.FileSystem.Tests.csproj
      - name: Run Sitko.Core.Storage.FileSystem.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Storage.FileSystem.Tests/Sitko.Core.Storage.FileSystem.Tests.csproj
      - name: Run Sitko.Core.Storage.S3.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Storage.S3.Tests/Sitko.Core.Storage.S3.Tests.csproj
      - name: Run Sitko.Core.Storage.S3.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Storage.S3.Tests/Sitko.Core.Storage.S3.Tests.csproj
      - name: Run Sitko.Core.Storage.Remote.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Storage.Remote.Tests/Sitko.Core.Storage.Remote.Tests.csproj
      - name: Run Sitko.Core.Storage.Remote.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Storage.Remote.Tests/Sitko.Core.Storage.Remote.Tests.csproj
      - name: Run Sitko.Core.Storage.Metadata.Postgres.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Storage.Metadata.Postgres.Tests/Sitko.Core.Storage.Metadata.Postgres.Tests.csproj
      - name: Run Sitko.Core.Storage.Metadata.Postgres.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Storage.Metadata.Postgres.Tests/Sitko.Core.Storage.Metadata.Postgres.Tests.csproj

  vault:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    env:
      VAULT__URI: http://vault:8200
      VAULT__TOKEN: twit3itPSAD0yok
      VAULT__MOUNTPOINT: secret
      VAULT__SECRETS__0: tests
      VAULT__SECRETS__1: test2
    services:
      vault:
        image: hashicorp/vault:1.21.4
        env:
          VAULT_DEV_ROOT_TOKEN_ID: twit3itPSAD0yok
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.Configuration.Vault.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Configuration.Vault.Tests/Sitko.Core.Configuration.Vault.Tests.csproj
      - name: Run Sitko.Core.Configuration.Vault.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Configuration.Vault.Tests/Sitko.Core.Configuration.Vault.Tests.csproj

  kafka:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.Queue.Kafka.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.Queue.Kafka.Tests/Sitko.Core.Queue.Kafka.Tests.csproj
      - name: Run Sitko.Core.Queue.Kafka.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.Queue.Kafka.Tests/Sitko.Core.Queue.Kafka.Tests.csproj

  clickhouse:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container
    steps:
      - uses: actions/checkout@v4
      - name: Run Sitko.Core.ClickHouse.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.ClickHouse.Tests/Sitko.Core.ClickHouse.Tests.csproj
      - name: Run Sitko.Core.ClickHouse.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.ClickHouse.Tests/Sitko.Core.ClickHouse.Tests.csproj
      - name: Run Sitko.Core.ClickHouse.Linq2db.Tests net8.0
        run: dotnet test --logger GitHubActions --framework net8.0 tests/Sitko.Core.ClickHouse.Linq2db.Tests/Sitko.Core.ClickHouse.Linq2db.Tests.csproj
      - name: Run Sitko.Core.ClickHouse.Linq2db.Tests net10.0
        run: dotnet test --logger GitHubActions --framework net10.0 tests/Sitko.Core.ClickHouse.Linq2db.Tests/Sitko.Core.ClickHouse.Linq2db.Tests.csproj

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ build, apps, blazor, grpc, imgproxy, pdf, queue, repository, sonyflake, storage, vault, opensearch, kafka, clickhouse ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Semantic Release
        uses: sitkoru/semantic-release-action@v2
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.BOT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.BOT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.BOT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.BOT_EMAIL }}
