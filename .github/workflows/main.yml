name: Main

on:
  push:
    branches:
      - master
      - v13
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build
        run: dotnet build -c Release
      - name: Create packages
        run: dotnet pack -c Release --no-build -p:PackageOutputPath=$(pwd)/packages
  apps:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
    steps:
      - uses: actions/checkout@v7
      - name: Run Sitko.Core.App.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.App.Tests/Sitko.Core.App.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
          --report-trx --report-trx-filename Sitko.Core.App.Tests-net10.0.trx
          --results-directory TestResults/apps/Sitko.Core.App.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/apps/Sitko.Core.App.Tests/net10.0/diagnostics
      - name: Run Sitko.Core.App.Web.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.App.Web.Tests/Sitko.Core.App.Web.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
          --report-trx --report-trx-filename Sitko.Core.App.Web.Tests-net10.0.trx
          --results-directory TestResults/apps/Sitko.Core.App.Web.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/apps/Sitko.Core.App.Web.Tests/net10.0/diagnostics
      - name: Run Sitko.Core.Email.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.Email.Tests/Sitko.Core.Email.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 2
          --report-trx --report-trx-filename Sitko.Core.Email.Tests-net10.0.trx
          --results-directory TestResults/apps/Sitko.Core.Email.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/apps/Sitko.Core.Email.Tests/net10.0/diagnostics
      - name: Save test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apps-net10.0-test-results
          path: TestResults/apps/
          retention-days: 3

  blazor:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
    steps:
      - uses: actions/checkout@v7
      - name: Run Sitko.Core.App.Blazor.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.App.Blazor.Tests/Sitko.Core.App.Blazor.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
          --report-trx --report-trx-filename Sitko.Core.App.Blazor.Tests-net10.0.trx
          --results-directory TestResults/blazor/Sitko.Core.App.Blazor.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/blazor/Sitko.Core.App.Blazor.Tests/net10.0/diagnostics
      - name: Save test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blazor-net10.0-test-results
          path: TestResults/blazor/
          retention-days: 3

  grpc:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
    steps:
      - uses: actions/checkout@v7
      - name: Run Sitko.Core.Grpc.Client.Tests net10.0
        env:
          JOB_CONTAINER_ID: ${{ job.container.id }}
        run: >-
          docker run --rm --network host
          --volumes-from "$JOB_CONTAINER_ID"
          --volume /var/run/docker.sock:/var/run/docker.sock
          --workdir "$GITHUB_WORKSPACE"
          --env GITHUB_ACTIONS --env GITHUB_WORKSPACE --env GITHUB_STEP_SUMMARY
          --env TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1
          ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
          dotnet test --project tests/Sitko.Core.Grpc.Client.Tests/Sitko.Core.Grpc.Client.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
          --report-trx --report-trx-filename Sitko.Core.Grpc.Client.Tests-net10.0.trx
          --results-directory TestResults/grpc/Sitko.Core.Grpc.Client.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/grpc/Sitko.Core.Grpc.Client.Tests/net10.0/diagnostics
      - name: Run Sitko.Core.Grpc.Server.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.Grpc.Server.Tests/Sitko.Core.Grpc.Server.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
          --report-trx --report-trx-filename Sitko.Core.Grpc.Server.Tests-net10.0.trx
          --results-directory TestResults/grpc/Sitko.Core.Grpc.Server.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/grpc/Sitko.Core.Grpc.Server.Tests/net10.0/diagnostics
      - name: Run Sitko.Core.Repository.Grpc.Tests net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.Repository.Grpc.Tests/Sitko.Core.Repository.Grpc.Tests.csproj
          --framework net10.0 --report-github --minimum-expected-tests 1
          --report-trx --report-trx-filename Sitko.Core.Repository.Grpc.Tests-net10.0.trx
          --results-directory TestResults/grpc/Sitko.Core.Repository.Grpc.Tests/net10.0
          --diagnostic --diagnostic-output-directory TestResults/grpc/Sitko.Core.Repository.Grpc.Tests/net10.0/diagnostics
      - name: Save test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grpc-net10.0-test-results
          path: TestResults/grpc/
          retention-days: 3

  imgproxy:
