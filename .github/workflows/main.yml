        with:
          name: imgproxy-net10.0-test-results
          path: TestResults/imgproxy/
          retention-days: 3

  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    container: ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
    env:
      PDF_TEST_BROWSER_WS_ENDPOINT: ws://browserless:3000/chromium?token=pdf-ci
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.57.0@sha256:6bac628b3d8293f8fb251d3a6b63030dfc5a1cb0c7e5c39abe5efd8f4b25360b
        env:
          TOKEN: pdf-ci
          CONCURRENT: '4'
        options: >-
          --health-cmd="curl --fail http://localhost:3000/pressure?token=pdf-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure HTTP fixture address for CDP
        run: echo "PDF_TEST_HTTP_HOST=$(hostname -i | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Запустить Sitko.Core.Pdf.Tests через CDP net10.0
        run: >-
          dotnet test --project tests/Sitko.Core.Pdf.Tests/Sitko.Core.Pdf.Tests.csproj --minimum-expected-tests 1
          --report-github --report-trx --report-trx-filename Sitko.Core.Pdf.Tests-net10.0.trx
          --results-directory TestResults/pdf/Sitko.Core.Pdf.Tests/net10.0/cdp
          --framework net10.0 --diagnostic
          --diagnostic-output-directory TestResults/pdf/Sitko.Core.Pdf.Tests/net10.0/cdp/diagnostics
      - name: Install local Chromium
        run: >-
          tests/Sitko.Core.Pdf.Tests/bin/Debug/net10.0/.playwright/node/linux-x64/node
          tests/Sitko.Core.Pdf.Tests/bin/Debug/net10.0/.playwright/package/cli.js
          install --with-deps chromium
      - name: Запустить Sitko.Core.Pdf.Tests локально net10.0
        env:
          PDF_TEST_BROWSER_WS_ENDPOINT: ''
          PDF_TEST_HTTP_HOST: 127.0.0.1
        run: >-
          dotnet test --project tests/Sitko.Core.Pdf.Tests/Sitko.Core.Pdf.Tests.csproj --minimum-expected-tests 1
          --no-build --report-github --report-trx --report-trx-filename Sitko.Core.Pdf.Tests-net10.0.trx
          --results-directory TestResults/pdf/Sitko.Core.Pdf.Tests/net10.0/local
          --framework net10.0 --diagnostic
          --diagnostic-output-directory TestResults/pdf/Sitko.Core.Pdf.Tests/net10.0/local/diagnostics
      - name: Save PDF test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-net10.0-test-results
          path: TestResults/pdf/
          retention-days: 3
      - name: Trust workspace for PDF test report
        if: ${{ always() && github.event_name == 'push' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Report PDF tests
        if: ${{ always() && github.event_name == 'push' }}
        uses: dorny/test-reporter@v3
        with:
          name: PDF
          path: TestResults/pdf/**/*.trx
          reporter: dotnet-trx

  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container: ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
    env:
      REDIS_FIXTURE_PREFIX: redis-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Подготовить рабочий каталог Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Проверить Redis и Valkey на net10.0
        shell: bash
        env:
          JOB_CONTAINER_ID: ${{ job.container.id }}
        run: |
          set -euo pipefail
          for framework in net10.0; do
            # Тесты меняют роли узлов, поэтому каждая платформа получает новый стенд.
            docker run -d --name "$REDIS_FIXTURE_PREFIX-sentinel" \
              --network "container:$JOB_CONTAINER_ID" --volumes-from "$JOB_CONTAINER_ID:ro" \
              --health-cmd 'valkey-cli -p 26381 --user sentinel-client -a sentinel-test ping | grep -q PONG' \
              --health-interval 1s --health-timeout 3s --health-retries 30 \
              --entrypoint sh \
              valkey/valkey:8.1.4-alpine@sha256:e706d1213aaba6896c162bb6a3a9e1894e1a435f28f8f856d14fab2e10aa098b \
              "$GITHUB_WORKSPACE/tests/Sitko.Core.Auth.Tests/Valkey/start.sh"
            docker run -d --name "$REDIS_FIXTURE_PREFIX-cluster" \
              --network "container:$JOB_CONTAINER_ID" --volumes-from "$JOB_CONTAINER_ID:ro" \
              --health-cmd 'valkey-cli -p 17379 -a cluster-test cluster info | grep -q cluster_state:ok' \
              --health-interval 1s --health-timeout 3s --health-retries 30 \
              --entrypoint sh \
              valkey/valkey:9.0.3-alpine@sha256:e1095c6c76ee982cb2d1e07edbb7fb2a53606630a1d810d5a47c9f646b708bf5 \
              "$GITHUB_WORKSPACE/tests/Sitko.Core.Auth.Tests/Valkey/cluster-start.sh"
            deadline=$((SECONDS + 60))
            for fixture in sentinel cluster; do
              until [ "$(docker inspect --format '{{.State.Health.Status}}' "$REDIS_FIXTURE_PREFIX-$fixture")" = healthy ]; do
                if (( SECONDS >= deadline )); then
                  echo "Стенд $fixture не готов за 60 секунд" >&2
                  exit 1
                fi
                sleep 1
              done
            done
            dotnet test --project tests/Sitko.Core.Auth.Tests/Sitko.Core.Auth.Tests.csproj --minimum-expected-tests 1 \
              --framework "$framework" --report-github --report-trx --report-trx-filename Sitko.Core.Auth.Tests-net10.0.trx \
              --results-directory "TestResults/redis/Sitko.Core.Auth.Tests/$framework" \
              --diagnostic --diagnostic-output-directory "TestResults/redis/Sitko.Core.Auth.Tests/$framework/diagnostics"
            for fixture in sentinel cluster; do
              docker logs "$REDIS_FIXTURE_PREFIX-$fixture"
              docker rm -f "$REDIS_FIXTURE_PREFIX-$fixture"
            done
          done
      - name: Получить журналы оставшихся стендов Redis
        if: always()
        run: |
          for fixture in sentinel cluster; do
            if docker container inspect "$REDIS_FIXTURE_PREFIX-$fixture" >/dev/null 2>&1; then
              docker logs "$REDIS_FIXTURE_PREFIX-$fixture"
            fi
          done
      - name: Остановить оставшиеся стенды Redis
        if: always()
        run: |
          for fixture in sentinel cluster; do
            if docker container inspect "$REDIS_FIXTURE_PREFIX-$fixture" >/dev/null 2>&1; then
              docker rm -f "$REDIS_FIXTURE_PREFIX-$fixture"
            fi
          done
      - name: Сохранить результаты тестов Redis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redis-net10.0-test-results
          path: TestResults/redis/
          retention-days: 3

  queue:
    runs-on: ubuntu-latest
    container: ghcr.io/sitkoru/actions-container@sha256:64891a80d26f2ce15e2b94ccfff7330f26363e615c4864ba91d19650b7c9ffa8
